name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - "artifacts/realtime-service/**"
      - "lib/event-contracts/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  pull_request:
    branches: [main]
    paths:
      - "artifacts/realtime-service/**"
      - "lib/event-contracts/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        run: pnpm --filter @workspace/realtime-service run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: typecheck
    env:
      PORT: "5000"
      JWT_SECRET: "ci-test-secret"
      REDIS_URL: "redis://localhost:6379"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @workspace/realtime-service run build

  test:
    name: Relay Contract Tests
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run relay contract tests
        run: pnpm --filter @workspace/realtime-service run test

